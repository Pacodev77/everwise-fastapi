<!-- app/templates/components/sidebar.html -->
<aside class="sidebar">
    <div class="brand-header">
        <img src="/static/img/letra_blue.png" alt="Logo" class="brand-logo">
        <div class="brand-title">Everwise</div>
    </div>

    <div class="sidebar-label">Ciclo Escolar</div>
    <select id="ciclo-select" 
            name="ciclo" 
            class="sidebar-select"
            hx-get="/dashboard/fragments/kpis"
            hx-target="#kpi-container"
            hx-trigger="change"
            hx-include="[name='campus']"
            onchange="htmx.trigger('#composite-container', 'reloadChart'); htmx.trigger('#ai-container', 'reloadInsights');">
        <option value="2025 - 2026" {% if ciclo_seleccionado == "2025 - 2026" %}selected{% endif %}>2025 · 2026 (Activo)</option>
        <option value="2026 - 2027" {% if ciclo_seleccionado == "2026 - 2027" %}selected{% endif %}>2026 · 2027 (Próximo)</option>
        <option value="2024 - 2025" {% if ciclo_seleccionado == "2024 - 2025" %}selected{% endif %}>2024 · 2025 (Histórico)</option>
    </select>

    <div class="sidebar-label" style="margin-top: 1.5rem;">Navegación Principal</div>
    <ul class="nav-menu">
        <li class="nav-item">
            <a href="/dashboard" class="nav-link {% if active_tab == 'resumen' %}active{% endif %}">
                📊 Resumen Ejecutivo
            </a>
        </li>
        <li class="nav-item">
            <a href="/academic" class="nav-link {% if active_tab == 'academic' %}active{% endif %}">
                📈 Desempeño Académico
            </a>
        </li>
        <li class="nav-item">
            <a href="/ixl" class="nav-link {% if active_tab == 'ixl' %}active{% endif %}">
                🎯 Diagnóstico IXL
            </a>
        </li>
        <li class="nav-item">
            <a href="/clima" class="nav-link {% if active_tab == 'clima' %}active{% endif %}">
                🌱 Clima Escolar
            </a>
        </li>
        <li class="nav-item">
            <a href="/disciplina" class="nav-link {% if active_tab == 'disciplina' %}active{% endif %}">
                📋 Disciplina
            </a>
        </li>
        <li class="nav-item">
            <a href="/comparativa" class="nav-link {% if active_tab == 'comparativa' %}active{% endif %}">
                🌐 Comparativa Multicampus
            </a>
        </li>
        <li class="nav-item">
            <a href="/preescolar" class="nav-link {% if active_tab == 'preescolar' %}active{% endif %}">
                🧸 Preescolar Cualitativo
            </a>
        </li>
        <li class="nav-item">
            <a href="/upload" class="nav-link {% if active_tab == 'upload' %}active{% endif %}">
                📁 Ingesta de Datos
            </a>
        </li>
        <li class="nav-item">
            <a href="/audit" class="nav-link {% if active_tab == 'audit' %}active{% endif %}">
                🔍 Bitácora CRM
            </a>
        </li>
    </ul>

    <div class="user-profile">
        <div class="user-info">
            <div class="user-name">{{ user.name }}</div>
            <div class="user-role">{{ user.role }}</div>
        </div>
        <form action="/logout" method="POST" style="margin:0;">
            <button type="submit" class="logout-btn">Salir</button>
        </form>
    </div>
</aside>
