<!-- app/templates/fragments/kpi_summary.html -->
<div class="grid-3">
    <div class="card">
        <div class="card-title">Asistencia Promedio</div>
        <div class="card-value">{{ asis_val }}</div>
        <div class="card-subtext text-ok">✓ Reporte Consolidado (Ciclo {{ ciclo }})</div>
    </div>
    <div class="card">
        <div class="card-title">Matemáticas (B3)</div>
        <div class="card-value">{{ math_val }}</div>
        <div class="card-subtext text-ok">+1.3% vs B2 (Bimestre Actual)</div>
    </div>
    <div class="card">
        <div class="card-title">Español (B3)</div>
        <div class="card-value">{{ esp_val }}</div>
        <div class="card-subtext text-ok">+0.8% vs B2 (Bimestre Actual)</div>
    </div>
</div>
