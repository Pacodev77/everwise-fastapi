<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everwise | Actualización de Contraseña Obligatoria</title>
    <link rel="icon" type="image/png" href="/static/img/letra_blue.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="/static/img/letra_blue.png" alt="Everwise" style="height: 48px; margin-bottom: 0.5rem;">
            <h1 style="font-size: 1.5rem; font-weight: 800; color: #ffffff;">Actualización de Contraseña</h1>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.3rem;">
                Por políticas de seguridad corporativa, debes cambiar tu contraseña inicial de producción antes de ingresar al sistema.
            </p>
        </div>

        {% if error %}
        <div style="background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/change-password" method="POST">
            <div class="form-group">
                <label class="form-label" for="new_password">Nueva Contraseña</label>
                <input class="form-control" type="password" id="new_password" name="new_password" placeholder="Mínimo 6 caracteres" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirmar Nueva Contraseña</label>
                <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Repite la contraseña" required>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">Guardar Contraseña y Continuar</button>
        </form>

        <form action="/logout" method="POST" style="margin-top: 1rem; text-align: center;">
            <button type="submit" style="background: transparent; border: none; color: #94a3b8; font-size: 0.82rem; cursor: pointer; text-decoration: underline;">
                Cancelar y cerrar sesión
            </button>
        </form>
    </div>
</body>
</html>
